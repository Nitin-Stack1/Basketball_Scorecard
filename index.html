<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basketball Scorecard</title>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        
        <div class="container">
            <h1>SCORECARD</h1>
            <div>
                <h3 >HOME</h3>
                <span class="score" id="score-board-home">0</span>
                <div  class="add-point-btn">
                    <button class="btn1">+1</button>
                    <button class="btn2">+2</button>
                    <button class="btn3">+3</button>
                </div>
            </div>
            <div>
                <h3>AWAY</h3>
                <span class="score" id="score-board-guest">0</span>
                 <div  class="add-point-btn">
                    <button class="btn1">+1</button>
                    <button class="btn2">+2</button>
                    <button class="btn3">+3</button>
                </div>
            </div>
            <span id="lead-team">Which team has the lead</span>
            <button class="reset">RESET SCORE</button>
        </div>
        <script type="module" src="/index.js"></script>
    </body>
</html>
